name: CI

on:
  pull_request:
    branches: [main, DEV]
  push:
    branches: [main, DEV]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependências de sistema (PyAudio)
        run: sudo apt-get update && sudo apt-get install -y portaudio19-dev
      - run: pip install -r requirements.txt
      # Versao fixa: os defaults do ruff mudam entre releases e quebram o CI sozinhos.
      - run: pip install ruff==0.16.8
      - run: ruff check .
      # TUI (pasta frontend/ na raiz) herda as regras do backend/pyproject.toml
      - run: ruff check ../frontend
      - run: python -m compileall . ../frontend
      # pytest segue desligado: 11 testes de test_work_macros_spotify.py falham antes desta mudança.
      # - run: pytest
