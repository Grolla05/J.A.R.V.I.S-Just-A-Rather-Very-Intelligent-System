name: CI

on:
  pull_request:
    branches: [main, DEV]
  push:
    branches: [main, DEV]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependências de sistema (PyAudio)
        run: sudo apt-get update && sudo apt-get install -y portaudio19-dev
      - run: pip install -r requirements.txt
      # Versao fixa: os defaults do ruff mudam entre releases e quebram o CI sozinhos.
      - run: pip install ruff==0.16.8
      - run: ruff check .
      - run: python -m compileall .
      # - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm i --legacy-peer-deps
      - run: npm run lint
      - run: npm run build
