name: Release

# Cada merge na main (push na main) gera um Release novo com um único asset:
# dist/JARVIS-Setup.exe, o instalador completo (Python embutido + todas as
# libs + código). Versão: VERSION define major.minor; o patch sobe sozinho a
# partir da última tag vX.Y.* (sem tag ainda, usa o patch do VERSION). Depois
# do Release, o CI grava a versão publicada de volta no VERSION da main e da
# DEV (commit do github-actions[bot]). Para subir o minor/major, edite o
# VERSION para X.Y.0 no PR: o release sai exatamente com essa versão.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Dois merges seguidos não podem calcular a mesma tag
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write   # criar tag e Release

jobs:
  release:
    name: Instalador (Windows) e Release
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout (com tags)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Lint e testes (gate do release)
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install ruff==0.16.8 pytest
          ruff check .
          ruff check ../frontend
          # test_work_macros_spotify.py: 11 testes já falhavam antes (ver main.yml)
          python -m pytest tests -q --ignore=tests/test_work_macros_spotify.py

      - name: Próxima versão
        id: versao
        run: |
          $base = (Get-Content VERSION -Raw).Trim()
          if ($base -notmatch '^(\d+)\.(\d+)\.(\d+)$') { throw "VERSION invalido: '$base' (use X.Y.Z)" }
          $mm = "$($Matches[1]).$($Matches[2])"
          $patchBase = [int]$Matches[3]
          $patches = @(git tag --list "v$mm.*" | ForEach-Object {
            if ($_ -match "^v$([regex]::Escape($mm))\.(\d+)$") { [int]$Matches[1] }
          })
          $patch = if ($patches.Count) { [math]::Max(($patches | Measure-Object -Maximum).Maximum + 1, $patchBase) } else { $patchBase }
          $v = "$mm.$patch"
          Write-Host "Versao: $v"
          "versao=$v" >> $env:GITHUB_OUTPUT

      # O ISCC não aceita caminhos acima de 260 caracteres (MAX_PATH). A pasta
      # do runner já tem ~105, e há arquivos do onnxruntime com ~156 dentro de
      # dist\runtime: "Compile aborted / The system cannot find the path
      # specified". Mapeando a raiz em J:\ os caminhos ficam curtos.
      - name: Encurtar caminho da raiz (J:\)
        run: |
          subst J: "$env:GITHUB_WORKSPACE"
          if ($LASTEXITCODE -ne 0) { throw "subst falhou ($LASTEXITCODE)" }

      - name: Runtime Python + código (dist/runtime, dist/app)
        working-directory: 'J:\'
        run: ./installer/build_runtime.ps1 -Versao ${{ steps.versao.outputs.versao }}

      - name: Instalar Inno Setup 6
        run: choco install innosetup -y --no-progress

      - name: Gerar JARVIS-Setup.exe
        working-directory: 'J:\'
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          & $iscc /Q "/DVersao=${{ steps.versao.outputs.versao }}" installer\jarvis.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc falhou ($LASTEXITCODE)" }

      - name: Testar instalar / rodar / desinstalar
        working-directory: 'J:\'
        run: ./installer/test_setup.ps1

      # Fora da main (workflow_dispatch em outra branch) é um ensaio: gera e
      # testa o setup, guarda como artifact, mas não cria tag nem Release
      - name: Guardar setup do ensaio (artifact)
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Setup-ensaio
          path: dist/JARVIS-Setup.exe
          retention-days: 7

      - name: Publicar Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.versao.outputs.versao }}
          target_commitish: ${{ github.sha }}
          name: J.A.R.V.I.S v${{ steps.versao.outputs.versao }}
          generate_release_notes: true
          make_latest: true
          files: dist/JARVIS-Setup.exe
          fail_on_unmatched_files: true

      # Sem isto o VERSION do repositório ficava parado (ex.: 1.0.0 com o v1.0.5
      # publicado): a versão só existia na tag e no instalador. Grava pela API
      # (sem checkout, a pasta do build não muda). Commit feito com o
      # GITHUB_TOKEN não dispara outro workflow, então não há release em loop.
      # Falhar aqui não desfaz o Release: só fica o aviso no log.
      - name: Gravar a versão publicada no VERSION (main e DEV)
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          VERSAO: ${{ steps.versao.outputs.versao }}
        run: |
          $repo = "${{ github.repository }}"
          $conteudo = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes($env:VERSAO))
          foreach ($branch in 'main', 'DEV') {
            $atual = gh api "repos/$repo/contents/VERSION?ref=$branch" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { Write-Warning "VERSION não lido na $branch"; continue }
            $texto = [Text.Encoding]::ASCII.GetString([Convert]::FromBase64String($atual.content)).Trim()
            if ($texto -eq $env:VERSAO) { Write-Host "$branch já está em $env:VERSAO"; continue }
            gh api -X PUT "repos/$repo/contents/VERSION" `
              -f message="chore(release): VERSION $env:VERSAO [skip ci]" `
              -f content="$conteudo" -f sha="$($atual.sha)" -f branch="$branch" | Out-Null
            if ($LASTEXITCODE -ne 0) { Write-Warning "Não consegui gravar o VERSION na $branch" }
            else { Write-Host "VERSION da $branch: $texto -> $env:VERSAO" }
          }
